# V5.3-R4 trusted verification on a native GitHub-hosted runner.
# Equivalent of the self-hosted PTYSD-V45-CONTROL-01 csg-trusted-verifier job:
# same trigger surface, same immutable workflow_sha trust anchor, same verifier, same arguments,
# same fail-closed behaviour, plus the retained trusted CLI negative regression.
# The self-hosted runner-identity assertion is replaced by GitHub-hosted runner isolation and the
# same-repository guard that protects pull_request_target. No secrets are referenced or exposed.
name: V5.3-R4 CSG trusted verifier (GitHub-hosted)
on:
  pull_request_target:
    branches:
      - main
      - v45/factory-control
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  csg-trusted-verifier-hosted:
    if: ${{ github.event_name == 'pull_request_target' }}
    concurrency:
      group: csg-trusted-verifier-hosted
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify same-repository PR before any privileged step
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo BLOCKED_FORK_PR
            exit 44
          fi
      - name: Checkout immutable trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1
      - name: Verify workflow source SHA
        shell: bash
        run: |
          set -euo pipefail
          TRUSTED_SHA="$(git -C trusted rev-parse HEAD)"
          if [ "$TRUSTED_SHA" != "${{ github.workflow_sha }}" ]; then
            echo TRUSTED_SOURCE_SHA_MISMATCH
            exit 43
          fi
      - name: Checkout candidate bytes without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: ''
      - name: Negative regression - trusted verifier CLI must fail closed
        shell: bash
        run: |
          set -euo pipefail
          node --test trusted/tests/csg/csg-trusted-pr-verifier-cli.test.mjs
      - name: Run immutable structural verifier only
        shell: bash
        run: |
          set -euo pipefail
          node trusted/governance/csg/trust-root/csg-trusted-pr-verifier.mjs \
            candidate \
            ${{ github.event.pull_request.base.sha }} \
            ${{ github.event.pull_request.head.sha }} \
            ${{ github.event.pull_request.base.ref }}
