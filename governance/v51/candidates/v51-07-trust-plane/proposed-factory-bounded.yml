name: VNEXT4.6 formal bounded driver candidate

on:
  workflow_dispatch:
    inputs:
      control_sha:
        description: Exact immutable control commit to verify
        required: true
        type: string
  pull_request_target:
    branches:
      - main
      - v45/factory-control
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  bounded-driver-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    concurrency:
      group: factory-governance-primary
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Verify unprivileged hosted candidate runner
        shell: bash
        run: |
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
      - name: Checkout exact immutable control commit without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.control_sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: ''
      - name: Verify exact checked out commit
        shell: bash
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "${{ inputs.control_sha }}"
          echo EXACT_CONTROL_SHA=PASS
      - name: Run bounded driver and identity admission regression
        shell: bash
        run: >-
          node --test
          tests/v46-effect-identity.test.mjs
          tests/v46-receipt-identity.test.mjs
          tests/v46-profile-gates.test.mjs
          tests/v46-driver.test.mjs

  csg-trusted-verifier:
    if: ${{ github.event_name == 'pull_request_target' }}
    concurrency:
      group: csg-trusted-verifier
      cancel-in-progress: false
    runs-on:
      group: PTYSD-V46-CONTROL-TRUSTED
      labels: ptysd-governance-v45
    timeout-minutes: 10
    steps:
      - name: Verify trusted runner and same-repository PR
        shell: cmd
        run: |
          if not "%RUNNER_NAME%"=="PTYSD-V45-CONTROL-01" exit /b 41
          if /I not "%RUNNER_OS%"=="Windows" exit /b 42
          if /I not "${{ github.event.pull_request.head.repo.full_name }}"=="${{ github.repository }}" exit /b 44
      - name: Checkout immutable trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1
      - name: Verify workflow source SHA
        shell: cmd
        run: |
          for /f %%i in ('git -C trusted rev-parse HEAD') do set TRUSTED_SHA=%%i
          if /I not "%TRUSTED_SHA%"=="${{ github.workflow_sha }}" exit /b 43
      - name: Checkout candidate bytes without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 2
      - name: Provision Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: ''
      - name: Run immutable structural verifier only
        shell: cmd
        run: >-
          node trusted/governance/csg/trust-root/csg-trusted-pr-verifier.mjs
          candidate
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}
          ${{ github.event.pull_request.base.ref }}
          trusted
          ${{ github.workflow_sha }}
